<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Diamond_Clicker</title>
</head>

<body>
    <header>
        <h1>Diamond Clicker</h1>
        </header>
        <audio id="game-music" loop>
            <source src="./assets/images/funny-bgm-240795.mp3" type="audio/mpeg">
           
        </audio>
        <button id="play-button">Play Music</button>
        <button id="pause-button">Pause Music</button>
    <section>
        <div class="main">
            <div class="left">
                <h3>Diamant:<span class="diamondCost">70000</span></h3>
                <div class="diamond-img-container">
                <img src="./Assets/images/diamond.png" draggable="false" alt=""
                    onclick="incrementDiamond(event)" class="image-centre">
                </div>
            </div>
            <div class="right">
                <div class="upgrade" onclick="buyClick()">
                    <div class="left-section">
                        <img src="./Assets/images/istockphoto-977527838-612x612-removebg-preview.png" alt=""
                            class="upgrade-image">
                    </div>
                    <div class="mid-section">
                        <h4>
                            Cliker
                        </h4>
                        <div class="cost-info">
                            <p>
                                Cost: <span class="clickerCost">10</span>
                            </p>
                            <img src="./Assets/images/diamond.png" alt="" class="diamond-img">
                        </div>
                    </div>
                    <div class="right-section">
                        <p>Level <span class="clicker-level">0</span></p>
                    </div>
                    <div class="next-level-info">
                        <p>
                            +<span class="clicker-increase">1</span>diamond per click
                        </p>
                    </div>
                </div>
                <div class="upgrade" onclick="buyPickaxe()">
                    <div class="left-section">
                        <img src="./Assets/images/pickaxe.png" alt="" class="upgrade-image">
                    </div>
                    <div class="mid-section">
                        <h4>
                           Pickaxe
                        </h4>
                        <div class="cost-info">
                            <p>
                                Cost: <span class="pickaxeCost">130</span>
                            </p>
                            <img src="./Assets/images/diamond.png" alt="" class="diamond-img">
                        </div>
                    </div>
                    <div class="right-section">
                        <p>Level <span class="pickaxe-level">0</span></p>
                    </div>
                    <div class="next-level-info">
                        <p>
                            +<span class="pickaxe-increase">4 </span>diamond per pickaxe
                        </p>
                    </div>
                </div>

                <div class="upgrade" onclick="buyMiner()">
                    <div class="left-section">
                        <img src="./assets/images/mineur1-removebg-preview.png" alt="" class="upgrade-image">
                    </div>
                    <div class="mid-section">
                        <h4>
                          Miner
                        </h4>
                        <div class="cost-info">
                            <p>
                                Cost: <span class="minerCost">250</span>
                            </p>
                            <img src="./Assets/images/diamond.png" alt="" class="diamond-img">
                        </div>
                    </div>
                    <div class="right-section">
                        <p>Level <span class="miner-level">0</span></p>
                    </div>
                    <div class="next-level-info">
                        <p>
                            +<span class="miner-increase">12 </span>diamond per click
                        </p>
                    </div>
                </div>

                
            </div>
        </div>
        <div class="statistics">
            <div class="texts">
            <p>DPC: <span id="dpc-text">1</span></p>
            <p>DPS: <span id="dps-text">0</span></p>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
