<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <section>
        <div class="main">
            <div class="left">
                <h3>Diamant:<span class="diamondCost">1000</span></h3>
                <!-- modification pour l'affichage du nombre quand on clic sur le diamant -->
                <div class="diamond-image-container">
                    <img src="./Assets/vecteezy_diamond-cartoon-icon_10966305-removebg-preview.png" draggable="false" alt=""
                    onclick="incrementDiamond(event)" class="image-centre">
                </div>
                
            </div>
            
            <div class="right">
                <div class="upgrade" onclick="buyClick()">
                    <div class="left-section">
                        <img src="./Assets/istockphoto-977527838-612x612-removebg-preview.png" alt=""
                            class="upgrade-image">
                    </div>
                    <div class="mid-section">
                        <h4>
                            Cliker
                        </h4>
                        <div class="cost-info">
                            <p>
                                Cost: <span class="clickerCost">10</span>
                            </p>
                            <img src="./Assets/vecteezy_diamond-cartoon-icon_10966305-removebg-preview.png" alt="" class="diamond-img">
                        </div>
                    </div>
                    <div class="right-section">
                        <p>Level <span class="clicker-level">0</span></p>
                    </div>
                    <div class="next-level-info">
                        <p>
                            +<span class="clicker-increase">1</span>diamond per click
                        </p>
                    </div>


                </div>


                <div class="upgrade" onclick="buyPickaxe()">
                    <div class="left-section">
                        <img src="./Assets/images-removebg-preview.png" alt=""
                            class="upgrade-image">
                    </div>
                    <div class="mid-section">
                        <h4>
                            Pickaxe
                        </h4>
                        <div class="cost-info">
                            <p>
                                Cost: <span class="pickaxeCost">130</span>
                            </p>
                            <img src="./Assets/vecteezy_diamond-cartoon-icon_10966305-removebg-preview.png" alt="" class="diamond-img">
                        </div>
                    </div>
                    <div class="right-section">
                        <p>Level <span class="pickaxe-level">0</span></p>
                    </div>
                    <div class="next-level-info">
                        <p>
                            +<span class="pickaxe-increase">4</span>diamond per second
                        </p>
                    </div>


                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
